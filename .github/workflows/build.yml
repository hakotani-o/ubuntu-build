name: ubuntu-image-combined-with-kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.model }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: orangepi-5
            defconfig: orangepi-5-rk3588s_defconfig
            dtb: rk3588s-orangepi-5
            uboot_suffix: "07" # 引数に 07 が必要な場合
          - model: orangepi-5-plus
            defconfig: orangepi-5-plus-rk3588_defconfig
            dtb: rk3588-orangepi-5-plus
            uboot_suffix: "07" # PLUS側も同様なら記述

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: u-boot
        # matrix から defconfig と suffix を取得して実行
        run: /bin/bash ./das-u-boot.sh ${{ matrix.defconfig }} ${{ matrix.uboot_suffix }}

      - name: kernel
        run: /bin/bash ./build-kernel.sh arm64 2>&1|tee log1
        
      - name: rootfs
        run: |
            chmod +x ubuntu-image.sh
            sudo ./ubuntu-image.sh

      - name: disk image
        run: |
            chmod +x disk_image.sh
            sudo ./disk_image.sh arm64 ${{ matrix.model }} ${{ matrix.dtb }}
            echo "============================"
            ls -l
            echo "============================="

      - name: Get current date
        id: date
        run: echo "now=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Get kernel version
        id: kernel
        run: |
          if [ -f kernel_version ]; then
            cat kernel_version >> $GITHUB_OUTPUT
          else
            echo "kernel_version=unknown" >> $GITHUB_OUTPUT
          fi
        
      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Orange Pi 5/PLUS Build ${{ github.run_number }}"
          body: |
            Orange Pi 5 / 5 PLUS 自作ディスクイメージ
            ビルド日時: ${{ steps.date.outputs.now }}
            ベースカーネル: ${{ steps.kernel.outputs.kernel_version }}
          draft: false
          prerelease: false
          # 【重要】既存のリリースがある場合にファイルを追記・更新できるようにする
          allow_updates: true
          # 【重要】2つのジョブが同時に書き込んでもエラーにならないようにする
          make_latest: true
          files: ./Ubuntu-*img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

